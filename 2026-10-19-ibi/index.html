# Motivation und Ausgangslage

--

## Motivation

ca. 2012/2013 @ [Forschungszentrum L3S](https://www.l3s.de/):

> build a longitudinal knowledge base on (German) academia ("DBpedia
> for the German research landscape") → **German Academic Web** (GAW)

→ Projektantrag war nicht erfolgreich ("es gibt doch Google"), aber
wir haben einfach los- und weitergecrawlt

→ https://german-academic-web.de/

--

## Ausgangslage

*halbjährliche Crawls "deutscher akademischer Webseiten"*

→ Seed-Liste mit ca. 150 Web-Domänen [Deutscher Universitäten](http://de.wikipedia.org/wiki/Liste_der_Hochschulen_in_Deutschland)
mit Promotionsrecht

(+mpg.de & fraunhofer.de)


--

## Ausgangslage


> [Heritrix](https://github.com/internetarchive/heritrix3) is the
> Internet Archive's open-source, extensible, web-scale,
> archival-quality web crawler project.


komplexe Konfiguration, z.B.,

- Kontaktdaten, [Webseite](https://amor.cms.hu-berlin.de/~jaeschkr/crawler/)
- Ressourcenbeschränkungen (Threads, Speicher etc.)
- Ein-/Ausschlussregeln *(← damit kann man Stunden verbringen!)*

eine (derzeit) [3761 Zeilen lange XML-Datei](https://scm.cms.hu-berlin.de/ipa/gaw/blob/master/crawler-beans.cxml)


--

## WARC

[Web ARChive](https://en.wikipedia.org/wiki/Web_ARChive)-Format – ISO-Standard
- gzip-komprimierte Dateien (1GB groß, >7000 Dateien pro Crawl)
- eine Datei enthält mehrere (tausend) WARC-Records
- diese beinhalten HTTP-Anfragen und -Antworten und zusätzliche Metadaten

```shell
WARC/1.0
WARC-Type: response
WARC-Target-URI: https://www.uni-potsdam.de/de/lit-19-jhd/peertrilcke/
WARC-Date: 2023-06-10T19:28:35Z
WARC-IP-Address: 141.89.68.50
WARC-Payload-Digest: sha1:DRWDIPN6JOUXLP7WHVXPWYPHDFAELZM5
WARC-Record-ID: <urn:uuid:e7c44472-0622-48f8-a4b5-84cb2a89a769>
Content-Type: application/http; msgtype=response
Content-Length: 57723

HTTP/1.1 200 OK
Date: Sat, 10 Jun 2023 19:28:35 GMT
Server: Apache
Content-Language: de
Content-Length: 57458
Cache-Control: max-age=0
Expires: Sat, 10 Jun 2023 19:28:35 GMT
Vary: Accept-Encoding
Connection: close
Content-Type: text/html; charset=utf-8

<!DOCTYPE html><html dir="ltr" lang="de-DE"><head><meta charset="utf-8"><
...
```

## CDX

Index-Dateien mit Metadaten; spaltenbasiert (TSV); eine Zeile pro WARC-Record

| id | Erklärung                        | Beispiel                                       |
| -- | -------------------------------- | ----                                           |
| N  | massaged url (special SURT form) | de,uni-freiburg,bioss)/cms/2075.html           |
| b  | timestamp                        | 20141201095348                                 |
| a  | original url                     | http://www.bioss.uni-freiburg.de/cms/2075.html |
| m  | mime type of original document   | text/html                                      |
| s  | response code                    | 200                                            |
| k  | checksum                         | PH4FSLSY6LKYQQ7SMOT7D4YFUK4IM6ZQ               |
| r  | redirect                         | -                                              |
| M  | meta tags                        | -                                              |
| S  | compressed record size           | 29237                                          |
| V  | compressed arc/warc file offset  | 491                                            |
| g  | filename                         | 20141201095350661-00089.warc.gz                |

## Pre-Crawling

<small>

In order to create a new GAW job, do the following:
- check for a new version of Heritrix
- check disk space (delete/cleanup old job)
- create seed list ([`get_seeds.py`](https://scm.cms.hu-berlin.de/ipa/gaw/-/blob/master/src/get_seeds.py?ref_type=heads))
- clean seed list ([`clean_seeds.py`](https://scm.cms.hu-berlin.de/ipa/gaw/-/blob/master/src/clean_seeds.py?ref_type=heads))
- fix indicated errors/problems
- add FHG+MPG
- add seed list to git ([`data/2025-12-09.seeds`](https://scm.cms.hu-berlin.de/ipa/gaw/-/blob/master/data/2025-12-09.seeds?ref_type=heads))
- add changes from last crawls
- *important*: read remarks from [`LogBook.org`](https://scm.cms.hu-berlin.de/ipa/gaw/-/blob/master/LogBook.org?ref_type=heads)
- start Heritrix
- open https://localhost:8443/
- create a new job from `gaw-profile`
- build the new job
- move the job directory
- create symbolic link
- create another symbolic link
- copy seeds
- update/add [`crawler-beans.cxml`](https://scm.cms.hu-berlin.de/ipa/gaw/-/blob/master/crawler-beans.cxml?ref_type=heads)
- launch job
- unpause job
- update https://amor.cms.hu-berlin.de/~jaeschkr/crawler/
- *send mail to noc@cms.hu-berlin.de, noc@tu-berlin.de,
  cert@dfn-cert.de & Uni K. (content: source IP, reason, Dauer)*
- edit `progress.gpi` and start monitoring script [`crawl_progress.sh`](https://scm.cms.hu-berlin.de/ipa/gaw/-/blob/master/src/crawl_progress.sh?ref_type=heads)
- check number of retired hosts

*"I needed several iterations to find the correct way to do this.  The
above sequence worked several times for me!"*

[Quelle](https://scm.cms.hu-berlin.de/ipa/gaw/-/blob/master/README.org)

</small>

## Post-Crawling


- stop monitoring scripts
- pause job, wait until paused *(this can take a while)*
- terminate job, wait until terminated *(this can take a while)*
- add `crawler_beans.cxml` to git ([`./data/${next_crawl_date}_crawler_beans.cxml`](https://scm.cms.hu-berlin.de/ipa/gaw/-/blob/master/data/2020-06_crawler-beans.cxml?ref_type=heads)
- create directory on HDFS (`hdfs dfs -mkdir /data/web/gaw/2025-12`)
- compute MD5 sums (and add them to [`data`](https://scm.cms.hu-berlin.de/ipa/gaw/-/tree/master/src?ref_type=heads))
- copy data to HDFS (L3S and possibly also HU)
- compute MD5 sums in HDFS
- copy MD5 sums to local dir
- compare MD5 sums ([`compare_md5.sh`](https://scm.cms.hu-berlin.de/ipa/gaw/-/blob/master/src/compare_md5.sh?ref_type=heads))
- create mapping to rename files ([`move_warcs.py`](https://scm.cms.hu-berlin.de/ipa/gaw/-/blob/master/src/move_warcs.py?ref_type=heads))
- actually rename the files ([`BatchRename`](https://github.com/rjoberon/hadoop-tools/blob/master/src/main/java/de/l3s/hadoop/BatchRename.java))
- store file listing
- generate CDX
- compress crawl log files and copy to cluster
- generate statistics and update the  [web page](https://german-academic-web.de/basic_statistics.html)

[Quelle](https://scm.cms.hu-berlin.de/ipa/gaw/-/blob/master/README.org)
